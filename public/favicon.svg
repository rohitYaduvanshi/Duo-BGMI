<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#18140c" />
      <stop offset="70%" stop-color="#0a0c08" />
      <stop offset="100%" stop-color="#040503" />
    </radialGradient>
    <linearGradient id="ringGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f4c430" />
      <stop offset="50%" stop-color="#ff8a1e" />
      <stop offset="100%" stop-color="#e0680a" />
    </linearGradient>
    <linearGradient id="innerGlow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ff8a1e" stop-opacity="0.35" />
      <stop offset="100%" stop-color="#0a0d08" stop-opacity="0" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <!-- Outer Dark Base Circle -->
  <circle cx="256" cy="256" r="248" fill="url(#bgGrad)" stroke="#1a2013" stroke-width="4" />

  <!-- Outer Dashed Tactical Ring -->
  <circle cx="256" cy="256" r="236" fill="none" stroke="#ff8a1e" stroke-width="2.5" stroke-dasharray="8,8" opacity="0.4" />

  <!-- Main Glowing Amber Ring -->
  <circle cx="256" cy="256" r="208" fill="none" stroke="url(#ringGrad)" stroke-width="18" filter="url(#glow)" />
  <circle cx="256" cy="256" r="195" fill="none" stroke="#f4c430" stroke-width="2.5" opacity="0.85" />

  <!-- Inner Dark Core -->
  <circle cx="256" cy="256" r="185" fill="#0d1109" stroke="#ff8a1e" stroke-width="2" opacity="0.95" />
  <circle cx="256" cy="256" r="185" fill="url(#innerGlow)" />

  <!-- "DS" Bold Typography -->
  <text x="256" y="285" font-family="'Arial Black', 'Impact', sans-serif" font-weight="900" font-size="160" fill="#eae6d6" text-anchor="middle" letter-spacing="4">DS</text>

  <!-- Underline Accent Bar -->
  <rect x="176" y="322" width="160" height="14" rx="7" fill="url(#ringGrad)" />
</svg>
